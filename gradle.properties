# Ajustes de Gradle del proyecto.
# Más información: https://docs.gradle.org/current/userguide/build_environment.html

# Memoria del daemon. AGP 9 + Compose necesitan bastante más que los 1.5 GB anteriores.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
# Convierte librerías antiguas de la support library a AndroidX. Se mantiene por AAChartCore
# (JitPack); si `./gradlew checkJetifier` no reporta nada, se puede desactivar.
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
